<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CET Student Grievance Cell | Official Portal</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <!-- Application Stylesheet -->
    <link rel="stylesheet" href="/static/css/style.css">

    <!-- React 18 & ReactDOM -->
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    
    <!-- Babel Standalone for in-browser JSX parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.10/babel.min.js"></script>
</head>
<body>
    <div id="root">
        <div id="loading-spinner-container" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', sans-serif; color: #1e293b; background: #f8fafc; padding: 20px; text-align: center;">
            <div style="font-size: 2.2rem; font-weight: 800; color: #1e3a8a; margin-bottom: 12px; display: flex; align-items: center; gap: 10px;">
                <i class="fa-solid fa-building-columns"></i> CET Student Grievance Cell
            </div>
            <p id="loading-status-text" style="font-size: 1.05rem; color: #64748b;">Loading College of Engineering Trivandrum Portal...</p>
            <div id="loading-spinner" style="margin-top: 20px; width: 44px; height: 44px; border: 4px solid #e2e8f0; border-top-color: #1e3a8a; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
            
            <div id="loading-error-box" style="display: none; margin-top: 24px; max-width: 500px; background: #fef2f2; border: 1px solid #f87171; color: #991b1b; padding: 18px; border-radius: 12px; font-size: 0.9rem; text-align: left;">
                <div style="font-weight: 700; margin-bottom: 6px;"><i class="fa-solid fa-triangle-exclamation"></i> Script Loading Issue Detected</div>
                <div id="loading-error-msg">The React application bundle could not be loaded.</div>
                <button onclick="location.reload()" style="margin-top: 12px; padding: 8px 16px; background: #dc2626; color: #ffffff; border: none; border-radius: 6px; cursor: pointer; font-weight: 600;">
                    <i class="fa-solid fa-rotate-right"></i> Reload Page
                </button>
            </div>
        </div>
    </div>

    <!-- Error Detection & Static Route Watchdog -->
    <script>
      window.addEventListener('error', function(e) {
        var errBox = document.getElementById('loading-error-box');
        var errMsg = document.getElementById('loading-error-msg');
        var spinner = document.getElementById('loading-spinner');
        var statusText = document.getElementById('loading-status-text');
        if (errBox && errMsg && document.getElementById('loading-spinner-container')) {
          errBox.style.display = 'block';
          errMsg.innerText = e.message || 'Error loading script: ' + (e.filename || 'unknown');
          if (spinner) spinner.style.display = 'none';
          if (statusText) statusText.innerText = 'Failed to load CET Portal assets';
        }
      });

      // Safety probe: if root is still displaying spinner after 4 seconds
      setTimeout(function() {
        var container = document.getElementById('loading-spinner-container');
        var errBox = document.getElementById('loading-error-box');
        var errMsg = document.getElementById('loading-error-msg');
        if (container && errBox && errBox.style.display === 'none') {
          fetch('/static/js/app.js')
            .then(function(res) {
              if (!res.ok) {
                errBox.style.display = 'block';
                errMsg.innerHTML = 'Static file <code>/static/js/app.js</code> returned HTTP ' + res.status + ' (' + res.statusText + '). Django static view route was missing or blocked.';
                document.getElementById('loading-spinner').style.display = 'none';
              }
            })
            .catch(function(err) {
              errBox.style.display = 'block';
              errMsg.innerText = 'Network error fetching application logic: ' + err.message;
              document.getElementById('loading-spinner').style.display = 'none';
            });
        }
      }, 4000);
    </script>

    <!-- React Application Logic -->
    <script type="text/babel" src="/static/js/app.js"></script>
</body>
</html>
